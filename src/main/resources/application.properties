spring.application.name=contabilidad
# URL de conexión (usa host.docker.internal si tu app está en Docker y Postgres local)
spring.datasource.url=jdbc:postgresql://host.docker.internal:5432/BD_PROYECTOS
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# 'update' crea las tablas automáticamente si no existen o las actualiza si cambian
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=MiSecretoMuySecretoCambialo
jwt.expiration-ms=86400000